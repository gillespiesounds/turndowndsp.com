<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turndown DSP</title>
<meta name="description" content="Turndown DSP. Coming soon.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0a0b0c;
    --ground-deep: #050506;
    --trace: #f4f6f8;
    --trace-faint: #7a7f85;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 45%, var(--ground) 0%, var(--ground-deep) 75%);
    background-color: var(--ground-deep);
    color: var(--trace);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  main {
    box-sizing: border-box;
    height: 100%;
    padding-inline: max(16px, 4vw);
    padding-block: 24px;
    /* Word dead centre; "Coming soon" centred in the space below it. */
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    justify-items: center;
  }
  h1 {
    grid-row: 2;
    margin: 0;
    font-weight: 800;
    font-size: 17vw; /* replaced by the fit script once the font has loaded */
    line-height: 1;
    letter-spacing: -0.02em;
    white-space: nowrap;
    user-select: none;
  }
  h1 a {
    color: inherit;
    text-decoration: none;
  }
  h1 a:focus-visible {
    outline: 2px solid var(--trace-faint);
    outline-offset: 0.08em;
  }
  h1 span {
    display: inline-block;
    will-change: transform, opacity;
  }
  .soon {
    grid-row: 3;
    align-self: center;
    margin: 0;
    font-weight: 400;
    font-size: clamp(11px, 1.1vw, 15px);
    letter-spacing: 0.6em;
    margin-right: -0.6em; /* cancels the trailing letter-space so it centres */
    text-transform: uppercase;
    color: var(--trace-faint);
  }

  /* Start states only apply once the script has run, so the page still
     reads with scripts off. */
  .armed h1 span {
    opacity: 0;
    transform: translateY(var(--dy));
  }
  .armed .soon { opacity: 0; transform: translateY(8px); }

  /* The polarity slash through the O, drawn bottom-left to top-right. */
  h1 .o { position: relative; }
  h1 .o::after {
    content: "";
    position: absolute;
    left: 50%;
    top: var(--cy, 50%); /* set by the script to the O's own middle */
    width: 0.86em;
    height: 0.085em;
    margin-left: -0.43em;
    margin-top: -0.0425em;
    background: currentColor;
    transform: rotate(-58deg);
  }
  .armed h1 .o::after { clip-path: inset(0 100% 0 0); }
  .play h1 .o::after {
    clip-path: inset(0 0 0 0);
    transition: clip-path .5s cubic-bezier(.65, 0, .35, 1) 3.2s;
  }

  .play h1 span {
    opacity: 1;
    transform: none;
    transition:
      transform 3s cubic-bezier(.22, 1, .36, 1) var(--delay),
      opacity 2.2s ease-out var(--delay);
  }
  .play .soon {
    opacity: 1;
    transform: none;
    transition: opacity 1.6s ease-out 2.2s, transform 1.6s cubic-bezier(.22, 1, .36, 1) 2.2s;
  }

  @media (prefers-reduced-motion: reduce) {
    .armed h1 span { transform: none; }
    .armed .soon { transform: none; }
    .play h1 span { transition: opacity .8s ease-out; }
    .play .soon { transition: opacity .8s ease-out .6s; }
    .armed h1 .o::after { clip-path: none; opacity: 0; }
    .play h1 .o::after { opacity: 1; transition: opacity .8s ease-out 1.2s; }
  }
</style>
</head>
<body>

<main id="stage">
  <h1 aria-label="Turndown"><a href="https://www.instagram.com/turndowndsp/" target="_blank" rel="noopener" aria-label="Turndown DSP on Instagram"><span aria-hidden="true">T</span><span aria-hidden="true">U</span><span aria-hidden="true">R</span><span aria-hidden="true">N</span><span aria-hidden="true">D</span><span class="o" aria-hidden="true">O</span><span aria-hidden="true">W</span><span aria-hidden="true">N</span></a></h1>
  <p class="soon">Coming soon</p>
</main>

<script>
(function () {
  var stage = document.getElementById('stage');
  var word = stage.querySelector('h1');
  var letters = word.querySelectorAll('span');

  // Size the word to fill the width, but never taller than about half the screen.
  function fit() {
    word.style.fontSize = '100px';
    var avail = stage.clientWidth - 2 * parseFloat(getComputedStyle(stage).paddingLeft);
    // Sum the letters' own widths: scrollWidth would count the scattered
    // letters' offsets and shrink the word.
    var w = 0;
    letters.forEach(function (l) { w += l.offsetWidth; });
    var size = 100 * avail / w;
    size = Math.min(size, window.innerHeight * 0.55);
    word.style.fontSize = size + 'px';
  }

  // Centre the slash on the O itself: the middle of the letter's box is not
  // the middle of the O, and the gap differs per font.
  function centreSlash() {
    var o = word.querySelector('.o');
    var cs = getComputedStyle(word);
    var ctx = document.createElement('canvas').getContext('2d');
    ctx.font = cs.fontWeight + ' 1000px ' + cs.fontFamily;
    var m = ctx.measureText('O');
    if (!m.fontBoundingBoxAscent) return; // older browsers: keep the 50% fallback
    var asc = m.fontBoundingBoxAscent / 1000, desc = m.fontBoundingBoxDescent / 1000;
    var baseline = asc + (1 - asc - desc) / 2; // from the top of a line-height:1 box
    var mid = baseline - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2000;
    o.style.setProperty('--cy', mid.toFixed(4) + 'em');
  }

  // Letters alternate: first from above, next from below, and so on, each
  // starting a beat after the one to its left.
  function scatter() {
    var d = window.innerHeight * 0.6;
    letters.forEach(function (letter, i) {
      letter.style.setProperty('--dy', (i % 2 ? d : -d).toFixed(1) + 'px');
      letter.style.setProperty('--delay', (0.3 + i * 0.12).toFixed(2) + 's');
    });
  }

  scatter();
  stage.classList.add('armed');

  var started = false;
  function start() {
    if (started) return;
    started = true;
    fit();
    centreSlash();
    void word.offsetWidth; // commit the scattered state before playing
    stage.classList.add('play');
  }

  // Wait for the real font so the letters don't land in a fallback face,
  // but never hold the page for more than a second and a half.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
    setTimeout(start, 1500);
  } else {
    start();
  }

  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
